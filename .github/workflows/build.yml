name: Build plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-Windows-VST3
          path: build/BleekBassBox_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-Windows-Standalone
          path: build/BleekBassBox_artefacts/Release/Standalone/

  macos:
    name: macOS (VST3 + AU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel -- -quiet

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-macOS
          path: |
            build/BleekBassBox_artefacts/Release/VST3/
            build/BleekBassBox_artefacts/Release/AU/
