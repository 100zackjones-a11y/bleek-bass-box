name: Build plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build
        run: cmake --build build --config Release --parallel 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: |
          # Collect unique compiler/CMake error lines and post them as one annotation
          errs=$(cat configure.log build.log 2>/dev/null \
            | grep -E "error C[0-9]+|error LNK|fatal error|CMake Error|: error" \
            | sed -E 's#^.*[\\/](Source[\\/])#\1#; s/ \[[^]]*\.vcxproj\]//' \
            | sort -u | head -n 80)
          if [ -z "$errs" ]; then errs=$(tail -n 40 configure.log build.log 2>/dev/null); fi
          msg=$(printf '%s' "$errs" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Windows build errors::$msg"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-Windows-VST3
          path: build/BleekBassBox_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-Windows-Standalone
          path: build/BleekBassBox_artefacts/Release/Standalone/

  macos:
    name: macOS (VST3 + AU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build
        run: cmake --build build --config Release --parallel -- -quiet 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: |
          errs=$(cat configure.log build.log 2>/dev/null \
            | grep -E "error:|CMake Error" \
            | sed -E 's#^.*/(Source/)#\1#' \
            | sort -u | head -n 80)
          if [ -z "$errs" ]; then errs=$(tail -n 40 configure.log build.log 2>/dev/null); fi
          msg=$(printf '%s' "$errs" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')
          echo "::error title=macOS build errors::$msg"

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: BLEEK-BASS-BOX-macOS
          path: |
            build/BleekBassBox_artefacts/Release/VST3/
            build/BleekBassBox_artefacts/Release/AU/
